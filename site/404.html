<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — agent-07</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230a0a0b'/><text x='50' y='72' font-size='52' font-weight='bold' text-anchor='middle' fill='%23ff5c1f' font-family='monospace'>07</text></svg>">
  <style>
    :root {
      --bg: #0a0a0b;
      --fg: #e8e8ec;
      --fg-muted: #9a9aa3;
      --accent: #ff5c1f;
      --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .container {
      text-align: center;
      padding: 24px;
      position: relative;
      z-index: 1;
    }
    .bg-grid {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at 50% 50%, black 0%, transparent 70%);
    }
    .glitch {
      font-family: var(--font-mono);
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 700;
      letter-spacing: -0.05em;
      color: var(--accent);
      text-shadow: 2px 0 var(--accent), -2px 0 #3b9eff;
      animation: glitch 2.5s infinite;
      line-height: 1;
    }
    @keyframes glitch {
      0%, 100% { text-shadow: 2px 0 var(--accent), -2px 0 #3b9eff; transform: translateX(0); }
      20% { text-shadow: -2px 0 var(--accent), 2px 0 #3b9eff; transform: translateX(2px); }
      40% { text-shadow: 2px 0 #3b9eff, -2px 0 var(--accent); transform: translateX(-2px); }
      60% { text-shadow: -2px 0 var(--accent), 2px 0 #3b9eff; transform: translateX(1px); }
      80% { text-shadow: 2px 0 #3b9eff, -2px 0 var(--accent); transform: translateX(-1px); }
    }
    h1 {
      font-size: clamp(1.25rem, 3vw, 1.75rem);
      font-weight: 600;
      margin-top: 16px;
      margin-bottom: 8px;
    }
    p {
      color: var(--fg-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
      font-family: var(--font-mono);
    }
    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 13px;
      text-decoration: none;
      transition: opacity 0.2s, transform 0.2s;
    }
    .links a:hover { opacity: 0.85; transform: translateY(-1px); }
    .links a.primary {
      background: var(--accent);
      color: #fff;
    }
    .links a.secondary {
      border: 1px solid #2a2a30;
      color: var(--fg-muted);
      background: #131316;
    }
    .links a.secondary:hover { border-color: #3a3a44; }
  </style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <div class="glitch">404</div>
    <h1>signal lost</h1>
    <p>the page you requested does not exist on this server</p>
    <div class="links">
      <a href="/" class="primary">← back home</a>
      <a href="/lab" class="secondary">visit the lab →</a>
      <a href="/changelog" class="secondary">read the changelog →</a>
    </div>
  </div>
</body>
</html>
